<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#2481cc" />
    <title>MakeMeFit</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #ffffff;
        color: #1a1a1a;
      }
      
      #root {
        min-height: 100vh;
      }
      
      button {
        font-family: inherit;
      }
      
      input, textarea, select {
        font-family: inherit;
      }
      
      button:active {
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Telegram WebApp SDK will be loaded by @twa-dev/sdk -->
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Debug: Log Telegram WebApp availability
      window.addEventListener('load', () => {
        console.log('[Telegram] Window loaded');
        console.log('[Telegram] window.Telegram:', window.Telegram);
        console.log('[Telegram] window.tg:', window.tg);
        if (window.Telegram?.WebApp) {
          console.log('[Telegram] WebApp found:', {
            initData: window.Telegram.WebApp.initData,
            version: window.Telegram.WebApp.version,
            platform: window.Telegram.WebApp.platform,
          });
        }
      });
    </script>
  </body>
</html>
