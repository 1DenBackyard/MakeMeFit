[tool.poetry]
name = "makemefit-backend"
version = "0.1.0"
description = "FastAPI backend for MakeMeFit Telegram Mini App"
authors = ["MakeMeFit"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
sqlalchemy = "^2.0.0"
asyncpg = "^0.30.0"
alembic = "^1.13.0"
python-dotenv = "^1.0.1"
pydantic-settings = "^2.7.0"
httpx = "^0.27.0"
pyjwt = "^2.9.0"
passlib = "^1.7.4"
reportlab = "^4.2.0"
markdown = "^3.6"
aiolimiter = "^1.1.0"
python-multipart = "^0.0.9"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

