name: Deploy to VM

on:
  push:
    branches: [main, master]
  workflow_dispatch:  # Позволяет запускать вручную

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
      
      - name: Deploy to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DOMAIN_API: ${{ secrets.DOMAIN_API || 'api.example.com' }}
          DOMAIN_APP: ${{ secrets.DOMAIN_APP || 'app.example.com' }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << EOF
            set -e
            
            DOMAIN_API="${DOMAIN_API:-api.example.com}"
            DOMAIN_APP="${DOMAIN_APP:-app.example.com}"
            
            echo "🚀 Starting deployment..."
            echo "🌐 API Domain: \${DOMAIN_API}"
            echo "🌐 App Domain: \${DOMAIN_APP}"
            
            # Переходим в директорию проекта
            cd /opt/makemefit || (git clone https://github.com/${{ github.repository }}.git /opt/makemefit && cd /opt/makemefit)
            cd /opt/makemefit
            
            # Обновляем код
            git fetch origin
            git reset --hard origin/${{ github.ref_name }}
            
            # Проверяем .env
            if [ ! -f backend/.env ]; then
              echo "❌ .env file not found!"
              echo "Please create backend/.env on server first"
              exit 1
            fi
            
            # Останавливаем старые контейнеры
            echo "🛑 Stopping old containers..."
            cd infra
            docker-compose down || true
            
            # Собираем и запускаем новые контейнеры
            echo "🔨 Building containers..."
            docker-compose build --no-cache
            
            echo "🚀 Starting containers..."
            docker-compose up -d
            
            # Ждем запуска
            echo "⏳ Waiting for services to start..."
            sleep 15
            
            # Проверяем health
            echo "🔍 Checking health..."
            for i in {1..10}; do
              if curl -f http://localhost:8000/health > /dev/null 2>&1; then
                echo "✅ Health check passed!"
                break
              fi
              if [ \$i -eq 10 ]; then
                echo "❌ Health check failed!"
                docker-compose logs
                exit 1
              fi
              sleep 3
            done
            
            # Применяем миграции
            echo "📦 Running migrations..."
            docker-compose exec -T backend alembic upgrade head || echo "⚠️  Migrations skipped"
            
            # Настраиваем Nginx
            echo "🌐 Configuring Nginx..."
            
            # Создаем конфигурацию Nginx
            sudo tee /etc/nginx/sites-available/makemefit > /dev/null << NGINX_EOF
# Backend API
server {
    listen 80;
    server_name \${DOMAIN_API};
    return 301 https://\\\$server_name\\\$request_uri;
}

server {
    listen 443 ssl http2;
    server_name \${DOMAIN_API};

    ssl_certificate /etc/letsencrypt/live/\${DOMAIN_API}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/\${DOMAIN_API}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade \\\$http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host \\\$host;
        proxy_set_header X-Real-IP \\\$remote_addr;
        proxy_set_header X-Forwarded-For \\\$proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto \\\$scheme;
        proxy_cache_bypass \\\$http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}

# Frontend
server {
    listen 80;
    server_name \${DOMAIN_APP};
    return 301 https://\\\$server_name\\\$request_uri;
}

server {
    listen 443 ssl http2;
    server_name \${DOMAIN_APP};

    ssl_certificate /etc/letsencrypt/live/\${DOMAIN_APP}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/\${DOMAIN_APP}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://localhost:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade \\\$http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host \\\$host;
        proxy_cache_bypass \\\$http_upgrade;
    }
}
NGINX_EOF

            # Активируем конфигурацию
            sudo ln -sf /etc/nginx/sites-available/makemefit /etc/nginx/sites-enabled/makemefit
            sudo rm -f /etc/nginx/sites-enabled/default
            
            # Проверяем конфигурацию
            sudo nginx -t || {
              echo "❌ Nginx configuration error!"
              exit 1
            }
            
            # Получаем SSL сертификаты (если еще нет)
            echo "🔒 Getting SSL certificates..."
            sudo certbot --nginx -d \${DOMAIN_API} --non-interactive --agree-tos --email admin@example.com --redirect || echo "⚠️  Certificate for API already exists"
            sudo certbot --nginx -d \${DOMAIN_APP} --non-interactive --agree-tos --email admin@example.com --redirect || echo "⚠️  Certificate for App already exists"
            
            # Перезагружаем Nginx
            echo "🔄 Reloading Nginx..."
            sudo systemctl reload nginx
            
            echo "✅ Deployment completed successfully!"
            echo "🌐 API: https://\${DOMAIN_API}"
            echo "🌐 App: https://\${DOMAIN_APP}"
EOF
      
      - name: Cleanup
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
